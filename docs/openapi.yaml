openapi: 3.0.3
info:
  title: FunLibrary API
  description: >
    Tracks a user's reading list, reading sessions, and reading goals, and
    derives stats from them.
  version: "1.0.0"

servers:
  - url: /api

tags:
  - name: Books
    description: The shared, tenant-agnostic book catalog.
  - name: Book Lookups
    description: Read-only ISBN lookups against external catalog sources.
  - name: Reading List Entries
    description: A user's per-book reading list.
  - name: Reading Sessions
    description: Individual reading sessions logged against a reading list entry.
  - name: Reading Goals
    description: A user's target number of books for a period.
  - name: Stats
    description: Read-only stats derived from the above.

paths:
  /books:
    get:
      tags: [Books]
      summary: List books
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Book"
    post:
      tags: [Books]
      summary: Create a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book]
              properties:
                book:
                  $ref: "#/components/schemas/BookInput"
      responses:
        "201":
          description: Created
          headers:
            location:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Book"
        "422":
          $ref: "#/components/responses/ChangesetError"

  /books/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Books]
      summary: Get a book
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Book"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Books]
      summary: Update a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book]
              properties:
                book:
                  $ref: "#/components/schemas/BookInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Book"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ChangesetError"
    delete:
      tags: [Books]
      summary: Delete a book
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"

  /book_lookups:
    post:
      tags: [Book Lookups]
      summary: Look up a book by ISBN
      description: >
        Queries external catalog sources (Google Books, falling back to Open
        Library) for bibliographic data. Persists nothing — this is the
        preview step before adding a book to a reading list via
        `POST /reading_list_entries`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isbn]
              properties:
                isbn:
                  type: string
                  example: "9780132350884"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BookInput"
        "422":
          description: Invalid ISBN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: External catalog source unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reading_list_entries:
    get:
      tags: [Reading List Entries]
      summary: List a user's reading list entries
      parameters:
        - $ref: "#/components/parameters/UserIdQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReadingListEntry"
    post:
      tags: [Reading List Entries]
      summary: Add a book to a user's reading list
      description: >
        `book` is the (possibly user-edited) preview from
        `POST /book_lookups`; `entry` may set `status` (defaults to
        `want_to`), `started_at`, and `finished_at` — e.g. to log a book
        already finished.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, book]
              properties:
                user_id:
                  type: integer
                book:
                  $ref: "#/components/schemas/BookInput"
                entry:
                  type: object
                  properties:
                    status:
                      $ref: "#/components/schemas/EntryStatus"
                    started_at:
                      type: string
                      format: date
                    finished_at:
                      type: string
                      format: date
      responses:
        "201":
          description: Created
          headers:
            location:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReadingListEntry"
        "422":
          $ref: "#/components/responses/ChangesetError"

  /reading_list_entries/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Reading List Entries]
      summary: Get a reading list entry
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReadingListEntry"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Reading List Entries]
      summary: Update a reading list entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reading_list_entry]
              properties:
                reading_list_entry:
                  type: object
                  properties:
                    status:
                      $ref: "#/components/schemas/EntryStatus"
                    started_at:
                      type: string
                      format: date
                    finished_at:
                      type: string
                      format: date
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReadingListEntry"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ChangesetError"
    delete:
      tags: [Reading List Entries]
      summary: Delete a reading list entry
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"

  /reading_list_entries/{id}/pages:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Reading List Entries]
      summary: Set a per-entry page-count override
      description: >
        Used when the user's edition has a different page count than the
        catalog book. Pass `total_pages: null` to clear the override and
        fall back to the book's page count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reading_list_entry]
              properties:
                reading_list_entry:
                  type: object
                  properties:
                    total_pages:
                      type: integer
                      nullable: true
                      minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReadingListEntry"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ChangesetError"

  /reading_list_entries/{reading_list_entry_id}/reading_sessions:
    parameters:
      - name: reading_list_entry_id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Reading Sessions]
      summary: List sessions for a reading list entry
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
    post:
      tags: [Reading Sessions]
      summary: Start a reading session
      description: >
        Fails with 409 if the entry's reader already has an open (unfinished)
        session on any of their entries, this one included (one open session
        per reader, ADR 0005); the 409 body identifies that session. On
        success, flips the entry to `reading` and sets `started_at` if it
        wasn't set yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session]
              properties:
                session:
                  type: object
                  required: [start_page, started_at]
                  properties:
                    start_page:
                      type: integer
                      minimum: 0
                    started_at:
                      type: string
                      format: date-time
      responses:
        "201":
          description: Created
          headers:
            location:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Session"
        "409":
          description: The reader already has an open session (on any entry)
          content:
            application/json:
              schema:
                type: object
                required: [errors, open_session]
                properties:
                  errors:
                    type: object
                    properties:
                      detail:
                        type: string
                        example: Conflict
                  open_session:
                    $ref: "#/components/schemas/OpenSession"
        "422":
          $ref: "#/components/responses/ChangesetError"

  /reading_sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Reading Sessions]
      summary: Get a reading session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Reading Sessions]
      summary: Delete a reading session
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"

  /reading_sessions/{id}/finish:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Reading Sessions]
      summary: Finish an open reading session
      description: >
        Records the ending page and time. On success, flips the entry to
        `read` and sets `finished_at` if `end_page` reached the book's
        `total_pages`. Fails with 422 if `end_page` exceeds the book's
        `total_pages`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session]
              properties:
                session:
                  type: object
                  required: [end_page, ended_at]
                  properties:
                    end_page:
                      type: integer
                      minimum: 0
                    ended_at:
                      type: string
                      format: date-time
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ChangesetError"

  /reading_goals:
    get:
      tags: [Reading Goals]
      summary: List a user's reading goals
      description: >
        The user's goals with their derived state, books finished and outcome
        (ADR 0006): current goals first, then upcoming, then closed, each group
        newest period first. Periods compare by their last day, so an annual
        goal sorts after its December (newest first: before it).
      parameters:
        - $ref: "#/components/parameters/UserIdQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Goal"
    post:
      tags: [Reading Goals]
      summary: Create a reading goal
      description: >
        Creates a goal for one goal period: `period_start` must be the first
        day of a year (annual) or month (monthly), the period must be current
        or upcoming (app timezone), `target_books` must be positive, and the
        user may have at most one goal of each type per period. Fails with 422
        for a duplicate, past or misaligned period (error on `period_start`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal]
              properties:
                goal:
                  $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created
          headers:
            location:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Goal"
        "422":
          $ref: "#/components/responses/ChangesetError"

  /reading_goals/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Reading Goals]
      summary: Get a reading goal with its books
      description: >
        The goal plus the books it covers, derived from the reading list and
        sessions as they are now. `finished` holds its books finished, by
        finish date. `also_read` holds the user's other entries with at least
        one reading day in the period, by their last reading day in it; each
        is `carried_over` when it has a reading day after the period or was
        finished after it, otherwise labelled with its entry status. Books
        with no reading days (e.g. logged by hand) never appear in
        `also_read`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/GoalDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Reading Goals]
      summary: Change a reading goal's target
      description: >
        Only `target_books` can change; any other field is ignored. Fails with
        409 when the goal is closed (closed goals are locked, ADR 0006).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal]
              properties:
                goal:
                  $ref: "#/components/schemas/GoalTargetInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Goal"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/GoalClosed"
        "422":
          $ref: "#/components/responses/ChangesetError"
    delete:
      tags: [Reading Goals]
      summary: Delete a reading goal
      description: Fails with 409 when the goal is closed (locked, ADR 0006).
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/GoalClosed"

  /stats:
    get:
      tags: [Stats]
      summary: Dashboard summary for a user
      description: >
        Goal progress for each of the user's current goals, the reader's open session
        (or null), and a currently-reading snapshot with each entry's last
        session time, current page, pace and days left.
      parameters:
        - $ref: "#/components/parameters/UserIdQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StatsSummary"

  /reading_list_entries/{id}/stats:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Stats]
      summary: Per-entry stats
      description: |
        Percent complete, days elapsed, the reading span, and a pages-read-per-day
        series limited to the reading span. All dates are calendar days in the app's
        timezone. The span starts on the entry's start date and ends on its finish
        date (`read`), today (`reading`), or the last reading day, falling back to
        the start date (`stopped` / `unfinished`). See ADR 0003.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EntryStats"
        "404":
          $ref: "#/components/responses/NotFound"

  /stats/{user_id}/streak:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Stats]
      summary: Reading streak for a user
      description: >
        Current streak (consecutive reading days ending today, or yesterday if
        today has no reading yet) and streak record (longest run of consecutive
        reading days ever). Days are calendar days in the app's timezone.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Streak"

  /stats/{user_id}/activity:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Stats]
      summary: Reading activity per day for a user
      description: >
        Pages read and minutes read per reading day over the last `days` days
        ending today, oldest first, sparse (only days with reading). Uses the
        reading-day rule shared with the streak: a finished session that
        advanced pages counts entirely on the app-timezone day its `ended_at`
        falls on. `minutes` is the summed duration (`ended_at - started_at`)
        of that day's counted sessions, rounded to whole minutes.
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 84
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActivityDay"
        "400":
          description: "`days` is not a positive integer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats/{user_id}/daily_highlight:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Stats]
      summary: Daily highlight for a user
      description: >
        One session highlight of at most 120 characters, fixed for the
        calendar day in the app's timezone and cycling through every eligible
        highlight before any repeats. `data` is null when no highlight
        qualifies.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/DailyHighlight"
                    nullable: true

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
    UserIdQuery:
      name: user_id
      in: query
      required: true
      schema:
        type: integer

  responses:
    GoalClosed:
      description: The goal is closed, so it is locked (ADR 0006)
      content:
        application/json:
          schema:
            type: object
            required: [errors, reason]
            properties:
              errors:
                type: object
                properties:
                  detail:
                    type: string
                    example: Conflict
              reason:
                type: string
                enum: [goal_closed]
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ChangesetError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  isbn: ["can't be blank"]

  schemas:
    ErrorResponse:
      type: object
      properties:
        errors:
          type: object
          properties:
            detail:
              type: string

    EntryStatus:
      type: string
      enum: [want_to, reading, read, stopped, unfinished]

    PeriodType:
      type: string
      enum: [annual, monthly]

    Book:
      type: object
      properties:
        id:
          type: integer
        external_id:
          type: string
        external_source:
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        isbn:
          type: string
        cover_url:
          type: string
          nullable: true
        total_pages:
          type: integer
          nullable: true
        published_year:
          type: integer
          nullable: true

    BookInput:
      type: object
      required: [external_id, external_source, title, isbn]
      properties:
        external_id:
          type: string
        external_source:
          type: string
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        isbn:
          type: string
        cover_url:
          type: string
        total_pages:
          type: integer
        published_year:
          type: integer

    ReadingListEntry:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        book_id:
          type: integer
        status:
          $ref: "#/components/schemas/EntryStatus"
        started_at:
          type: string
          format: date
          nullable: true
        finished_at:
          type: string
          format: date
          nullable: true
        total_pages:
          type: integer
          nullable: true
          description: Per-entry override; falls back to the book's total_pages when unset.
        effective_total_pages:
          type: integer
          nullable: true
          description: total_pages if set, otherwise the catalog book's total_pages.

    Session:
      type: object
      properties:
        id:
          type: integer
        reading_list_entry_id:
          type: integer
        start_page:
          type: integer
        end_page:
          type: integer
          nullable: true
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true

    Goal:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        period_type:
          $ref: "#/components/schemas/PeriodType"
        period_start:
          type: string
          format: date
          description: First day of the goal period (a year or a month).
        period_end:
          type: string
          format: date
          description: Last day of the goal period; derived, not stored.
        target_books:
          type: integer
        state:
          type: string
          enum: [current, upcoming, closed]
          description: Derived from today (app timezone) versus the goal period.
        books_finished:
          type: integer
          description: The user's `read` entries whose finish date is in the goal period.
        outcome:
          type: string
          enum: [achieved, missed]
          nullable: true
          description: Null until the goal is closed.

    GoalBook:
      type: object
      properties:
        entry_id:
          type: integer
        book_id:
          type: integer
        title:
          type: string
        cover_url:
          type: string
          nullable: true

    GoalDetail:
      allOf:
        - $ref: "#/components/schemas/Goal"
        - type: object
          properties:
            finished:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/GoalBook"
                  - type: object
                    properties:
                      finished_at:
                        type: string
                        format: date
            also_read:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/GoalBook"
                  - type: object
                    properties:
                      label:
                        type: string
                        enum: [carried_over, reading, stopped, unfinished, want_to, read]
                        description: >
                          `carried_over`, or else the entry's status. `want_to` and
                          `read` (finished before the period) only arise from hand
                          edits.
                      last_reading_day:
                        type: string
                        format: date
                        description: The entry's last reading day within the goal period.

    GoalInput:
      type: object
      required: [user_id, period_type, period_start, target_books]
      properties:
        user_id:
          type: integer
        period_type:
          $ref: "#/components/schemas/PeriodType"
        period_start:
          type: string
          format: date
          description: >
            First day of a current or upcoming year (annual) or month (monthly).
        target_books:
          type: integer
          minimum: 1

    GoalTargetInput:
      type: object
      required: [target_books]
      properties:
        target_books:
          type: integer
          minimum: 1

    OpenSession:
      type: object
      properties:
        id:
          type: integer
        entry_id:
          type: integer
        start_page:
          type: integer
        started_at:
          type: string
          format: date-time

    ActivityDay:
      type: object
      properties:
        date:
          type: string
          format: date
        pages_read:
          type: integer
        minutes:
          type: integer

    DailyHighlight:
      type: object
      properties:
        session_id:
          type: integer
        entry_id:
          type: integer
        book_id:
          type: integer
        book_title:
          type: string
        highlight:
          type: string
          maxLength: 120

    StatsSummary:
      type: object
      properties:
        open_session:
          allOf:
            - $ref: "#/components/schemas/OpenSession"
          nullable: true
          description: The reader's open session on any entry (at most one, ADR 0005).
        goals:
          type: array
          items:
            type: object
            properties:
              goal_id:
                type: integer
              period_type:
                $ref: "#/components/schemas/PeriodType"
              period_start:
                type: string
                format: date
              period_end:
                type: string
                format: date
              target_books:
                type: integer
              books_finished:
                type: integer
        currently_reading:
          type: array
          items:
            type: object
            properties:
              entry_id:
                type: integer
              book_id:
                type: integer
              title:
                type: string
              percent_complete:
                type: number
                nullable: true
              last_session_at:
                type: string
                format: date-time
                nullable: true
                description: started_at of the entry's latest session; null without sessions.
              current_page:
                type: integer
                nullable: true
                description: >
                  End page of the latest session, or its start page if still
                  open; null without sessions.
              pace:
                type: number
                nullable: true
                description: >
                  Pages per day, 1 decimal: pages over the last 7 days (today
                  included) / 7; when zero, pages read so far / max(1, days
                  since the start date); null when neither is positive.
              days_left:
                type: integer
                nullable: true
                description: >
                  ceil(remaining pages / pace), using the entry's total_pages
                  override or the book's; null without a page count, without
                  a pace, or when nothing remains.

    Streak:
      type: object
      properties:
        current:
          type: integer
        record:
          type: integer

    EntryStats:
      type: object
      properties:
        percent_complete:
          type: number
          nullable: true
        days_elapsed:
          type: integer
          nullable: true
        reading_span:
          type: object
          nullable: true
          description: Null when the entry has no start date.
          properties:
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
        pages_per_day:
          type: array
          description: Only days with reading, within the reading span, oldest first.
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              pages_read:
                type: integer
